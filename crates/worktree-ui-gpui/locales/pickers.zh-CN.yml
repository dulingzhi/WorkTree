# 简体中文目录，对应 pickers.en.yml；键结构必须一致。
#
# 覆盖自行构建行的弹出选择器：分支检出选择器的创建行、工作区（徽章）
# 工作树选择器，以及仓库标签后的"+"菜单。标题与空态文案复用已有键
# （palette.cmd.*、ui.common.*）；分区标题保持英文标识键，渲染时经
# `tr_en` 本地化。
pick:
  # 选择器创建行下方的说明行：新分支/工作树所基于的引用。
  create_row:
    based_off: "基于 %{base}"
  branch:
    # 检出选择器创建行的前导部分。输入的名称作为独立（可搜索）部分跟随，
    # 因此末尾空格不可省略。
    create_prefix: "创建分支 "
  worktree:
    # 工作区选择器的搜索输入占位符。
    placeholder: "选择或输入以创建工作树"
    # 查询为空时的创建行。
    create_new: "创建新工作树"
    # 带查询时创建行的前导部分；末尾空格不可省略（查询作为独立可搜索
    # 部分跟随）。
    create_prefix: "创建工作树 "
    # 工作树行中文件夹与其检出分支之间的连接词，与其他分隔符一样以
    # 弱化样式渲染。
    on_separator: "  于  "
  add_repo:
    # 仓库标签后的"+"菜单。
    open: "打开仓库"
    clone: "克隆仓库"
    initialize: "初始化仓库"
  upstream:
    # 本地分支菜单“切换跟踪的上游分支…”选择器的标题。
    title: "跟踪上游分支"
    # 清除分支跟踪配置的行；被跟踪的引用跟随在同一行之后。
    unlink: "停止跟踪"
