# Locale files are keyed by filename (`inputs.en.yml` -> locale "en"), so
# the content below is the key tree directly — no `en:` root. English is also
# the fallback locale, so every value must stay byte-identical to the string
# it replaces in the sources (tests assert these exact texts).
#
# This catalog covers the small text-input prompt popovers: remote URL edit,
# add remote, rename branch, checkout remote branch, set-upstream push, clone
# repository, create stash, commit prompt, and submodule pointer change.
input:
  remote_edit_url:
    title: "Edit remote URL (%{kind})"
    remote_line: "Remote: %{name}"
    save: "Save"
  remote_ssh_key:
    title: "Set SSH key"
    remote_line: "Remote: %{name}"
    save: "Save"
    clear: "Clear"
  remote_add:
    title: "Add remote"
    name_label: "Name"
  rename_branch:
    title: "Rename branch"
    title_current: "Rename current branch"
    current_name_line: "Current name: %{name}"
    rename: "Rename"
  checkout_remote_branch:
    title: "Checkout remote branch"
    remote_branch_line: "Remote branch: %{upstream}"
    local_name_label: "Local branch name"
  push_upstream:
    title: "Set upstream and push"
    remote_line: "Remote: %{remote}"
    push: "Push"
  clone_repo:
    title: "Clone repository"
    url_label: "Repository URL / Path"
    destination_label: "Destination parent folder"
    ssh_key_label: "SSH key (optional)"
    select_folder: "Clone into folder"
    clone: "Clone"
  repo_settings:
    title: "Repository settings"
    user_label: "User name"
    email_label: "Email"
    inherit: "Inherits global"
    sign_label: "Sign commits"
    sign_inherit: "Inherits global setting"
    sign_on: "Always on in this repository"
    sign_off: "Off in this repository"
    apply: "Apply"
  stash:
    title: "Create stash"
    stash: "Stash"
    include_untracked: "Include untracked files"
    keep_index: "Keep staged changes"
    paths_selected: "Stashing %{count} selected path(s)"
  stash_branch:
    title: "Branch Stash"
    create: "Create Branch"
  mr_push:
    title: "Push with merge request"
    hint: "GitLab opens the merge request from this push (git push -o merge_request.*). GitHub remotes ignore these options."
    pipeline: "Merge when the pipeline succeeds"
    remove_source: "Delete source branch when merged"
    mr_branch: "Push to MR/<branch> instead of the branch itself"
    push: "Push"
    description: "Description (AI)"
    generate: "Generate with AI"
    generating: "Generating…"
    copy: "Copy"
    copied: "Description copied to the clipboard"
    target_required: "Enter a target branch (or set the remote's default branch) before generating"
    target_unsafe: "That target branch name cannot be used with git"
    no_commits: "There are no commits between the target branch and HEAD"
  commit:
    title: "Commit Changes"
    commit: "Commit"
  submodule_change_pointer:
    title: "Change submodule pointer"
    target_label: "Target ref / branch / tag / commit"
    change: "Change"
  assume_unchanged:
    title: "Assume-Unchanged Files"
    hint: "Files git is told to skip when checking for worktree changes. They leave the change list until the flag is removed."
    empty: "No files are marked assume-unchanged."
    remove_flag: "Remove flag"
    close: "Close"
