# Locale files are keyed by filename (`prompts.en.yml` -> locale "en"), so
# the content below is the key tree directly — no `en:` root. English is also
# the fallback locale, so every value must stay byte-identical to the string
# it replaces in the sources (tests assert these exact texts).
#
# This catalog covers the prompt popovers: reword (interactive rebase),
# submodule trust/add, squash, create tag/branch, cherry-pick confirm,
# worktree add, file history, and add-to-.gitignore.
prompts:
  popover:
    reword:
      title: "Reword commit message"
      commit_message: "Commit message"
      description: "Description"
      keep_original_hint: "Clear the message and save to keep the original commit message."
      cancel: "Cancel"
      save: "Save message"
  submodule_trust:
    title_add: "Trust local submodule?"
    title_update: "Trust local submodule sources?"
    confirm_add: "Trust and add"
    confirm_update: "Trust and update"
    confirm_load: "Trust and load"
    back: "Back"
    cancel: "Cancel"
    body: "Git blocks local file transport for submodules by default. Trusting these sources will allow WorkTree to enable file transport only for this repo/source pair."
    read_cve: "Read about CVE-2022-39253"
    submodule_line: "Submodule: %{path}"
    local_path_line: "Local path: %{path}"
    branch_line: "Branch: %{branch}"
    logical_name_line: "Logical name: %{name}"
    force_line: "Force: enabled"
    checking_title: "Checking submodule trust…"
    checking_body: "Checking local submodule sources…"
  squash:
    title_empty: "Squash commits"
    title_count: "Squash %{count} commits"
    not_squashable: "The selected commits are no longer squashable."
    summary_head: "%{oldest}..%{head} → one commit on HEAD"
    summary_rewrite: "%{oldest}..%{head} → one commit · rewriting commits above"
    building_message: "Building combined message…"
    build_error: "Could not build the combined message: %{error}"
    commit_message: "Commit message"
    description: "Description"
    submit: "Squash"
  autosquash:
    title: "Autosquash commits"
    title_count: "Autosquash %{count} commit(s)"
    loading: "Computing commits to fold…"
    empty: "No fixup!/squash! commits to fold into this range."
    fold_row: "%{fixup} → folds into %{sha} %{summary}"
    count_line: "%{count} commit(s) will be merged"
    confirm: "Autosquash"
  create_tag:
    title: "Create tag"
    target_line: "Target: %{target}"
    annotated_toggle: "Annotated tag"
    annotated_hint: "Annotated tags can be GPG signed and include a message"
    annotation_message: "Annotation message"
    create: "Create"
  create_branch:
    title: "Create branch"
    source_label: "Source:"
    source_branch_line: "Source branch: %{target}"
    name_label: "New branch name"
    checkout_toggle: "Checkout"
    create: "Create"
  submodule_add:
    title: "Add submodule"
    url_label: "URL"
    path_label: "Path (relative)"
    branch_label: "Branch (optional)"
    advanced: "Advanced"
    logical_name_label: "Logical name (optional)"
    force_toggle: "Force reuse / bypass collision checks"
    state_on: "On"
    state_off: "Off"
    force_hint: "Force reuses an existing local submodule git dir or bypasses Git's normal collision refusal."
    add: "Add"
  cherry_pick_confirm:
    title: "Commit cherry-picked commit?"
    apply_line: "Apply %{short} to the current branch?"
    commit_now_note: "Commit the cherry-picked change immediately?"
    mainline_title: "Mainline parent"
    mainline_hint: "Choose the parent Git should treat as the merge's mainline."
    parent_row: "Parent %{number}"
    answer_yes: "Yes"
    answer_no: "No"
  worktree_add:
    title: "Add worktree"
    folder_label: "Worktree folder"
    browse: "Browse"
    select_folder: "Select worktree folder"
    ref_label: "Branch / commit (optional)"
    add: "Add"
  file_history:
    title: "File history"
    folder_title: "Folder history"
    close: "Close"
  gitignore:
    title: "Add to .gitignore"
    ignore_label: "Ignore"
    scope_file: "File"
    scope_folder: "Folder"
    scope_extension: "Extension"
    ignore_one: "Ignore this file:"
    ignore_many: "Ignore these %{count} files:"
    more_note: "…and %{count} more"
    pattern_label: "Pattern"
    pattern_note: "One pattern per line, appended to %{file} in the repository root."
    unsaved_note: "%{file} has unsaved edits open in the editor. Saving them will overwrite this change."
    add: "Add"
