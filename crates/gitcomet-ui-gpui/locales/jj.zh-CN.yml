# Locale files are keyed by filename (`jj.zh-CN.yml` -> locale "zh-CN"), so
# the content below is the key tree directly — no `zh-CN:` root.
# Keys must mirror `jj.en.yml` one for one.
jj:
  flavor_chip: Jujutsu
  open_failed: "无法使用 jj 打开此仓库：%{error}"
  loading: 正在加载变更…
  working_copy:
    title: 工作副本
    empty_description: "（未设置描述）"
    conflicted: 有冲突
    divergent: 已分裂
  changes:
    count: "%{count} 个变更"
    more_available: 还有更多
    empty: "当前视图下没有变更。"
    load_more: 加载更多变更
  describe:
    placeholder: "描述这个变更…"
    submit: 描述
    new_change: 新建变更
    busy: "正在执行 %{operation}…"
  revset:
    placeholder: "按 revset 过滤（留空显示全部）…"
  details:
    title: 变更
    files_count: "%{count} 个路径"
    loading: 正在加载变更文件…
    error: "无法读取此变更：%{error}"
    empty: 此变更未改动任何路径。
    diff_hint: 点击路径即可查看差异。
    renamed_from: 原名 %{from}
    truncated: 差异已截断至 %{lines} 行。
    diff_loading: 正在加载差异…
    diff_error: "无法读取差异：%{error}"
    diff_empty: 此路径没有文本改动。
  conflicts:
    count: "%{count} 个冲突路径"
    recheck: 重新检查
    copy_hint: "点击路径即可复制。"
  bookmarks:
    title: 书签
    count: "%{count}"
    placeholder: "新书签名称…"
    create: 创建
    delete: 删除
    empty: "暂无书签。"
  op_log:
    title: 操作日志
    undo: 撤销最近操作
    empty: "暂无操作记录。"
    unnamed: "（未命名操作）"
  status:
    degraded_watch: "%{reason}"
    last_command_failed: "上一条命令失败（%{operation}）：%{error}"
