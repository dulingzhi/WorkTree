# Locale files are keyed by filename (`jj.en.yml` -> locale "en"), so the
# content below is the key tree directly — no `en:` root.
jj:
  flavor_chip: Jujutsu
  open_failed: "Could not open this repository with jj: %{error}"
  loading: Loading changes…
  working_copy:
    title: Working copy
    empty_description: "(no description set)"
    conflicted: conflicted
    divergent: divergent
  changes:
    count: "%{count} changes"
    more_available: more available
    empty: "No changes match the current view."
    load_more: Load more changes
  describe:
    placeholder: "Describe this change…"
    submit: Describe
    new_change: New change
    busy: "Running %{operation}…"
  revset:
    placeholder: "Filter by revset (empty shows all())…"
  conflicts:
    count: "%{count} conflicted paths"
    recheck: Re-check
    copy_hint: "Click a path to copy it."
  bookmarks:
    title: Bookmarks
    count: "%{count}"
    placeholder: "New bookmark name…"
    create: Create
    delete: Delete
    empty: "No bookmarks."
  op_log:
    title: Operation log
    undo: Undo latest
    empty: "No operations recorded."
    unnamed: "(unnamed operation)"
  status:
    degraded_watch: "%{reason}"
    last_command_failed: "Last command failed (%{operation}): %{error}"
