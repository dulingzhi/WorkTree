# Toast notifications and clone-progress chrome in `toast_host.rs`. Keyed by
# filename (`toast.en.yml` -> locale "en"); the content below is the key tree
# directly — no `en:` root.
toast:
  clone_finished: "Clone finished: %{dest}"
  clone_aborted: "Clone aborted: %{dest}"
  failed_save_reminder: "Failed to save %{name} reminder preference: %{err}"
  failed_open_link: "Failed to open link: %{err}"
  failed_save_preference: "Failed to save %{name} preference: %{err}"
  failed_open_survey: "Failed to open %{name}: %{err}"
  abort: Abort
  aborting: Aborting…
  adding_submodule: Adding submodule…
  dismiss_notification: Dismiss notification
  # Toasts raised by context-menu actions (context_menu.rs).
  context_menu:
    repo_gone: "That repository is no longer open."
    link_copied: "Link copied to clipboard"
    patch_empty: "Patch is empty"
    patch_build_failed: "Couldn't build patch for this hunk"
    path_outside_repo: "Refusing to open path outside repository"
    repo_unavailable: "Repository is not available"
