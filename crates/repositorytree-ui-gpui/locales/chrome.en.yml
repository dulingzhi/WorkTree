# Locale files are keyed by filename (`chrome.en.yml` -> locale "en"), so the
# content below is the key tree directly — no `en:` root. English is also the
# fallback locale, so every value must stay byte-identical to the string it
# replaces in the sources (tests assert these exact texts).
#
# This catalog is the tail of the i18n sweep: the window chrome the earlier
# per-surface catalogs did not cover — splash/interstitial screens (splash.rs),
# terminal panel header and exit strings (terminal_panel.rs), the crash-report
# banner, SSH/auth prompt and error banner (view/mod.rs), the bottom status
# bar chips and toggles (bottom_status_bar.rs), the manual open-repository bar
# (bars.rs), and the sidebar pane/row chrome (panes/sidebar.rs,
# rows/sidebar.rs). The sidebar file-filter tooltips deliberately reuse
# `diff.search.*`, whose three strings are byte-identical.
