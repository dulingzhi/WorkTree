# Locale files are keyed by filename (`confirm.en.yml` -> locale "en"), so
# the content below is the key tree directly — no `en:` root. English is also
# the fallback locale, so every value must stay byte-identical to the string
# it replaces in the sources (tests assert these exact texts).
#
# This catalog covers the confirm popovers: abort merge/rebase/cherry-pick,
# pull strategy, stash drop, delete remote/force-delete local branch,
# remove worktree (plain and forced), remove submodule/remote, stage with
# conflict markers, force push, unsaved file edits, terminal shutdown,
# rebase onto a ref, merge commit, and reset.
#
# NB: never name a key `on`/`off`/`yes`/`no` — YAML 1.1 parses them as
# booleans and the dot-path silently breaks.
confirm:
  common:
    quit_title: "Quit RepositoryTree?"
    close_window_title: "Close window?"
  merge_abort:
    title_merge: "Abort merge?"
    body_merge: "This will abort the current merge and restore the pre-merge state. Any resolved conflicts will be lost."
    title_rebase_or_apply: "Abort apply/rebase?"
    body_rebase_or_apply: "This will abort the in-progress patch apply or rebase and restore the previous state. Any resolved conflicts will be lost."
    title_cherry_pick: "Abort cherry-pick?"
    body_cherry_pick: "This will abort the current cherry-pick and restore the previous state. Any resolved conflicts will be lost."
    go_cherry_pick: "Abort cherry-pick"
  pull_reconcile:
    title: "Pull: choose strategy"
    body: "Fast-forward isn't possible. Choose whether to merge or rebase."
    command_merge: "Merge: git pull --no-rebase"
    command_rebase: "Rebase: git pull --rebase"
    merge: "Merge"
    rebase: "Rebase"
  stash_drop:
    title: "Drop stash?"
    body: "This permanently removes this stash entry."
    drop: "Drop"
  delete_remote_branch:
    title: "Delete remote branch?"
    body: "This will permanently delete the branch from the remote."
    delete: "Delete"
  force_delete_branch:
    title: "Delete branch anyway?"
    body: "This will permanently delete the local branch, even if it is not fully merged."
    delete_anyway: "Delete anyway"
  force_remove_worktree:
    title_with_branch: "Delete worktree and branch anyway?"
    title: "Delete worktree anyway?"
    body_with_branch: "This worktree has modified or untracked files. RepositoryTree will force-remove it, then delete the local branch '%{branch}'."
    body: "This worktree has modified or untracked files."
    delete_anyway: "Delete anyway"
  submodule_remove:
    title: "Remove submodule"
    remove: "Remove"
  remote_remove:
    title: "Remove remote"
    remote_line: "Remote: %{name}"
    remove: "Remove"
  worktree_remove:
    title_with_branch: "Remove worktree and branch"
    title: "Remove worktree"
    body_with_branch: "This will remove the worktree folder and delete the local branch '%{branch}'."
    remove: "Remove"
  stage_conflict_markers:
    title: "Stage unresolved conflicts"
    lead_one: "This file still contains merge conflict markers:"
    lead_many: "%{count} files still contain merge conflict markers:"
    more: "… and %{count} more"
    body: "Staging marks a conflict resolved, so the markers would be committed as file content."
    stage_anyway: "Stage anyway"
  force_push:
    title: "Force push"
    body_lease: "This will update %{remote}/%{branch} only if it still points at %{expected} and %{local_branch} is still checked out at %{local_head}."
    body: "This will overwrite remote history if your branch has diverged."
    go_lease: "Force push with lease"
    go: "Force push"
  unsaved_file_edits:
    text_one: "1 edited file has not been saved. Save them, or discard the changes."
    text_many: "%{count} edited files have not been saved. Save them, or discard the changes."
    discard_and_close: "Discard and close"
    discard_and_quit: "Discard and quit"
    save_all: "Save all"
  terminal_shutdown:
    title: "Close terminal?"
    terminal_one: "terminal"
    terminal_many: "%{count} terminals"
    text_one: "1 running command is still active in %{label}. Cancel to keep the terminal open, or terminate it to continue."
    text_many: "%{count} running commands are still active in %{label}. Cancel to keep the terminal open, or terminate it to continue."
    terminate_and_quit: "Terminate and quit"
    terminate_and_close: "Terminate and close"
  rebase_onto:
    title: "Rebase"
    note: "This rewrites commit history. Avoid rebasing commits already pushed to a shared branch."
    go: "Rebase"
  merge_commit:
    title: "Merge commit?"
    body: "Merge %{short} into %{current}?"
    note: "Git resolves the merge with a merge commit when history diverges."
    go: "Merge"
  reset:
    title: "Reset"
    note_hard: "Hard reset updates index + working tree (destructive)."
    note_mixed: "Mixed reset updates index only."
    note_soft: "Soft reset moves HEAD only."
    go: "Reset"
