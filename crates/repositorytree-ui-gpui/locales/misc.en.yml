# Locale files are keyed by filename (`misc.en.yml` -> locale "en"), so the
# content below is the key tree directly — no `en:` root. English is also the
# fallback locale, so every value must stay byte-identical to the string it
# replaces in the sources (tests assert these exact texts).
#
# Final catch-all catalog of the i18n sweep: the keep/delete conflict panel
# (view/panels/main/keep_delete_conflict.rs — the spec table itself stays
# English so its unit tests keep asserting raw fields; the panel localizes it
# at render through `tr_en`, with the gettext-style entries at the top of
# misc.zh-CN.yml), diff-canvas blame tooltips, conflict-resolver fold
# tooltips, markdown-preview availability strings, history panel chrome,
# commit-message placeholder, repo open/init toasts, terminal preference
# summaries and launcher errors, external-editor detection labels/errors, the
# user-survey toast, Linux GUI/desktop-install diagnostics, platform open
# errors, and the focused-diff window title.
misc:
  keep_delete:
    keep_and_close: "%{label} & close"
    keep_unavailable: "The keep side is unavailable in conflict stages; only deletion can be applied."
    empty_file: "(empty file)"
    not_present: "(not present in conflict stages)"
