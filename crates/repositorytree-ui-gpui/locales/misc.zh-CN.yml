# Gettext 风格条目：keep/delete 冲突规格表（keep_delete_conflict.rs）的
# 英文原文 → 中文。表在 Rust 侧保持英文（测试直接断言字段），渲染时经
# `tr_en` 查询。
"Modify / Delete conflict": "修改/删除冲突"
"Add / Delete conflict": "添加/删除冲突"
"This file was modified on the remote branch but deleted on your local branch.": "此文件在远程分支上被修改，但在您的本地分支上被删除。"
"This file was modified on your local branch but deleted on the remote branch.": "此文件在您的本地分支上被修改，但在远程分支上被删除。"
"This file was added on your local branch and deleted on the remote branch.": "此文件在您的本地分支上被添加，并在远程分支上被删除。"
"This file was added on the remote branch and deleted on your local branch.": "此文件在远程分支上被添加，并在您的本地分支上被删除。"
"Conflict": "冲突"
"Unexpected conflict type.": "意外的冲突类型。"
"Keep File (theirs)": "保留文件（对方）"
"Keep File (ours)": "保留文件（我方）"
"Accept Deletion (ours)": "接受删除（我方）"
"Accept Deletion (theirs)": "接受删除（对方）"
"Use Ours": "使用我方"
"Accept Deletion": "接受删除"
"Ours": "我方"
"Theirs": "对方"

# History-mode settings rows (spec table keeps English; rendered via `tr_en`
# in settings_window.rs, keyed by the English sentence).
"Show every commit reachable from the current branch tip.": "显示从当前分支尖端可达的所有提交。"
"Follow only the mainline path through merges.": "只沿合并的主线路径追溯。"
"Hide merge commits and show only ordinary commits.": "隐藏合并提交，只显示普通提交。"
"Show only merge commits for high-level integration history.": "只显示合并提交，便于总览集成历史。"
"Show commits reachable from all refs, not just the current branch.": "显示从所有引用可达的提交，而不仅是当前分支。"
"Markdown preview unavailable: document is too large to render; showing source.": "Markdown 预览不可用：文档过大无法渲染；显示源文件。"
