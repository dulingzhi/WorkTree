# 简体中文目录，与 chrome.en.yml 的键树一一对应。文件名给出 locale，
# 内容就是键树本身——没有 zh-CN: 根。英文是回退 locale，两个文件的
# 键必须完全一致，%{name} 占位符也必须逐字保留。
