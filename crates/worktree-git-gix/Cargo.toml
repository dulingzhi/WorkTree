[package]
name = "worktree-git-gix"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
benchmarks = ["worktree-core/benchmarks"]
# Cache-free native object reads (biturbo-style). ON by default = faster, no
# history-cache. Opt back to the pure-gix + disk-cache build with
# `--no-default-features`.
native-object = ["dep:worktree-git-native"]
default = ["native-object"]

[dependencies]
worktree-core = { workspace = true }
gix = { workspace = true }
rust-i18n = { workspace = true }
rustc-hash = { workspace = true }
tempfile = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
worktree-git-native = { workspace = true, optional = true }

[dev-dependencies]
worktree-core = { workspace = true, features = ["test-support", "benchmarks"] }
syn = { version = "3", features = ["full", "visit"] }
worktree-test-support = { workspace = true }
