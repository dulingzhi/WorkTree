name: Release (Manual Main Only)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.2.0 or v0.2.0)"
        required: true
        type: string
      deb_revision:
        description: "Debian package revision suffix appended to the upstream version (e.g. 1 for 1.2.3-1)."
        required: true
        default: "1"
        type: string
      prerelease:
        description: "Mark GitHub release as prerelease"
        required: true
        default: false
        type: boolean
      draft:
        description: "Keep release as draft after artifacts upload"
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-manual-main-${{ startsWith(github.event.inputs.version, 'v') && github.event.inputs.version || format('v{0}', github.event.inputs.version) }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate inputs and branch guard
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.norm.outputs.version }}
      tag: ${{ steps.norm.outputs.tag }}
      prerelease: ${{ steps.flags.outputs.prerelease }}
      draft: ${{ steps.flags.outputs.draft }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Enforce main-only dispatch
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "::error title=Invalid dispatch branch::This workflow may only run from main. Current ref: ${GITHUB_REF_NAME}"
            exit 1
          fi

      - name: Normalize and validate version/tag
        id: norm
        run: |
          set -euo pipefail
          raw="${{ github.event.inputs.version }}"
          raw="$(echo "$raw" | tr -d '[:space:]')"
          if [ -z "$raw" ]; then
            echo "::error title=Missing version::Input 'version' must not be empty."
            exit 1
          fi

          ver="${raw#v}"
          if ! [[ "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "::error title=Invalid version format::Expected semver like 1.2.3 or 1.2.3-rc.1."
            exit 1
          fi

          tag="v${ver}"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Release tag: $tag"

      - name: Verify crate version matches release version
        run: |
          set -euo pipefail
          crate_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)"
          wanted="${{ steps.norm.outputs.version }}"
          if [ "$crate_version" != "$wanted" ]; then
            echo "::error title=Version mismatch::Cargo.toml version '$crate_version' does not match requested release '$wanted'."
            exit 1
          fi

      - name: Ensure tag does not already exist on origin
        run: |
          set -euo pipefail
          tag="${{ steps.norm.outputs.tag }}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "::error title=Tag already exists::Tag ${tag} already exists in origin."
            exit 1
          fi

      - name: Normalize boolean flags
        id: flags
        run: |
          set -euo pipefail
          echo "prerelease=${{ github.event.inputs.prerelease }}" >> "$GITHUB_OUTPUT"
          echo "draft=${{ github.event.inputs.draft }}" >> "$GITHUB_OUTPUT"

  create_release:
    name: Create tag and draft GitHub release
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    needs: validate
    environment: release
    outputs:
      release_id: ${{ steps.create_release.outputs.release_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create annotated tag at current main commit
        run: |
          set -euo pipefail
          tag="${{ needs.validate.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "WorkTree $tag"
          git push origin "$tag"

      - name: Create draft GitHub release
        id: create_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ needs.validate.outputs.tag }}"
          prerelease="${{ needs.validate.outputs.prerelease }}"

          args=(release create "$tag" --repo "$GITHUB_REPOSITORY" --title "WorkTree $tag" --target "$GITHUB_SHA" --generate-notes --draft)
          if [ "$prerelease" = "true" ]; then
            args+=(--prerelease)
          fi

          gh "${args[@]}"
          release_id="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json id --jq '.id')"
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

  build_and_upload:
    name: Build and upload release artifacts
    needs: [validate, create_release]
    uses: ./.github/workflows/build-release-artifacts.yml
    with:
      tag: ${{ needs.validate.outputs.tag }}
      version: ${{ needs.validate.outputs.version }}
      deb_revision: ${{ github.event.inputs.deb_revision }}
      release_id: ${{ needs.create_release.outputs.release_id }}
    secrets: inherit

  # Iteration 06 T3 (second half): give scripts/compare-perf-runs.sh a delivery
  # path. Every release archives its own measured run, compares it against the
  # previous release's archive, and attaches both the comparison and the new
  # baseline to the release.
  #
  # Design constraints, driven by the account running out of hosted Actions
  # minutes in September 2026:
  #   - `if: vars.PERF_RUNNER != ''` — only ever runs on the self-hosted perf
  #     runner, so a release never consumes hosted minutes.
  #   - `continue-on-error: true` — a perf failure reports but never blocks or
  #     rolls back a release.
  #   - `needs: [validate, create_release]` — runs alongside build_and_upload
  #     instead of serialising behind it.
  perf_comparison:
    name: Performance comparison vs previous release
    needs: [validate, create_release]
    if: vars.PERF_RUNNER != ''
    runs-on: ${{ vars.PERF_RUNNER }}
    continue-on-error: true
    timeout-minutes: 180
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      WORKTREE_PERF_REAL_REPO_ROOT: ${{ vars.PERF_REAL_REPO_ROOT }}
      WORKTREE_PERF_RUNNER_CLASS: ${{ vars.PERF_RUNNER }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Preflight perf comparison tooling
        run: |
          set -euo pipefail
          missing=0
          for tool in jq tar git cargo; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "::error title=Missing perf comparison tool::'$tool' is required on the perf runner labelled '${{ vars.PERF_RUNNER }}'."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          jq --version
          cargo --version

      - name: Archive this release's performance run
        id: archive
        env:
          RUN_ID: release-${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          archive_status=0
          bash scripts/archive-perf-run.sh --run-id "$RUN_ID" --profile full --strict || archive_status=$?
          echo "archive_status=${archive_status}" >> "$GITHUB_OUTPUT"
          if [ "$archive_status" -ne 0 ]; then
            echo "::warning title=Perf suite reported a failure::archive-perf-run.sh exited ${archive_status}. The archive is still uploaded; see budget-report.md inside it."
          fi
          if [ ! -f "tmp/perf-records/${RUN_ID}/benchmark-metrics.jsonl" ]; then
            echo "::error title=Perf archive incomplete::Missing tmp/perf-records/${RUN_ID}/benchmark-metrics.jsonl; nothing to compare or upload."
            exit 1
          fi
          tar -czf perf-record.tar.gz \
            -C "tmp/perf-records/${RUN_ID}" \
            benchmark-metrics.jsonl \
            benchmark-metrics.log \
            budget-report.md \
            metadata.txt
          echo "run_dir=tmp/perf-records/${RUN_ID}" >> "$GITHUB_OUTPUT"

      - name: Fetch the previous release's performance record
        id: base
        env:
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p tmp/perf-base
          # TAG is normalised semver (vX.Y.Z) by the validate job, so it is safe
          # to interpolate into the jq query.
          prev_tag="$(
            gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 20 \
              --json tagName,isPrerelease \
              --jq "[.[] | select(.tagName != \"${TAG}\" and (.isPrerelease | not))] | .[0].tagName // empty"
          )"
          if [ -z "$prev_tag" ]; then
            echo "::warning title=No perf baseline::No earlier release found. This release becomes the first perf baseline."
            echo "dir=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Previous release: ${prev_tag}"
          if ! gh release download "$prev_tag" --repo "$GITHUB_REPOSITORY" \
              --pattern 'perf-record.tar.gz' --dir tmp/perf-base --clobber; then
            echo "::warning title=No perf baseline::${prev_tag} has no perf-record.tar.gz asset. This release becomes the baseline for the next one."
            echo "dir=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p "tmp/perf-records/base-${prev_tag}"
          tar -xzf tmp/perf-base/perf-record.tar.gz -C "tmp/perf-records/base-${prev_tag}"
          echo "tag=${prev_tag}" >> "$GITHUB_OUTPUT"
          echo "dir=tmp/perf-records/base-${prev_tag}" >> "$GITHUB_OUTPUT"

      - name: Compare against the previous release
        env:
          RUN_ID: release-${{ needs.validate.outputs.version }}
          BASE_DIR: ${{ steps.base.outputs.dir }}
          BASE_TAG: ${{ steps.base.outputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "$BASE_DIR" ]; then
            {
              echo "# Performance comparison"
              echo
              echo "No previous release performance record was available, so no"
              echo "comparison was produced. This release's archive"
              echo "(\`perf-record.tar.gz\`) is the baseline for the next release."
            } > perf-comparison.md
          else
            bash scripts/compare-perf-runs.sh \
              --sort regression \
              "$BASE_DIR" "tmp/perf-records/${RUN_ID}" > perf-comparison.md
            {
              echo "# Performance comparison: ${BASE_TAG} -> ${{ needs.validate.outputs.tag }}"
              echo
            } | cat - perf-comparison.md > perf-comparison.tmp
            mv perf-comparison.tmp perf-comparison.md
          fi
          cat perf-comparison.md
          cat perf-comparison.md >> "$GITHUB_STEP_SUMMARY"

      - name: Attach performance assets to the release
        env:
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          assets=(perf-record.tar.gz)
          if [ -f perf-comparison.md ]; then
            assets+=(perf-comparison.md)
          fi
          gh release upload "$TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber

  publish_release:
    name: Publish GitHub release
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    needs: [validate, create_release, build_and_upload]
    if: ${{ fromJSON(needs.validate.outputs.draft) == false }}
    permissions:
      contents: write
    steps:
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ needs.validate.outputs.tag }}"
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false
          gh release view "$tag" --repo "$GITHUB_REPOSITORY"

  # Only GitHub Releases are published for now. The reusable workflows for the
  # Homebrew tap, AUR, APT repository, Windows installer hosting, and the
  # Microsoft Store remain under .github/workflows/ but are no longer wired
  # into this release flow; re-add the jobs below to bring a channel back.

  cleanup_failed_release:
    name: Cleanup failed draft/tag
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    needs: [validate, create_release, build_and_upload]
    if: ${{ always() && needs.create_release.result == 'success' && needs.build_and_upload.result != 'success' }}
    permissions:
      contents: write
    steps:
      - name: Delete failed draft release and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ needs.validate.outputs.tag }}"
          gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
